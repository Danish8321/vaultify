name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The gates only have value if they run without anyone remembering to run them.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restore is its own step so a lockfile mismatch fails here, loudly,
      # rather than being masked by a later build failure.
      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: check.sh — build, format, analyzers
        run: bash .claude/scripts/check.sh

      - name: test-fast.sh — unit tests
        run: bash .claude/scripts/test-fast.sh

      # Regenerates the OpenAPI spec and fails if it differs from the committed
      # one. Drift appears exactly when someone changes a contract and does not
      # think about the client, which is precisely when nobody runs this by hand.
      - name: contract.sh — API contract drift
        run: bash .claude/scripts/contract.sh

      - name: test-full.sh — integration tests
        run: bash .claude/scripts/test-full.sh
