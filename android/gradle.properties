# AndroidX is the only support library line that still receives fixes; the
# legacy one does not. Required by the androidx.test dependencies.
android.useAndroidX=true

# Gradle's own JVM. 2g rather than the 512m default, because AGP's resource and
# dex tasks routinely exceed it and fail with an opaque OOM.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m

org.gradle.caching=true
org.gradle.parallel=true
