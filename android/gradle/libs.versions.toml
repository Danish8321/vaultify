# Single place where versions are ratified. Kept deliberately small: every entry
# is a dependency someone has to keep reviewing.
#
# No property-testing library is listed on purpose. The one property task 2.9
# calls for — "no nonce repeats across many generations" — is a loop and a set.
# A framework would be a new dependency bought for a five-line test.
# Every version here is an exact pin. No "+" and no ranges: a dynamic version
# means the build is not reproducible and a dependency can change under us
# between two runs — the same failure the .NET lockfiles exist to prevent.
[versions]
kotlin = "2.3.21"
agp = "8.13.1"
androidx-test-runner = "1.7.0"
androidx-test-junit = "1.3.0"
# Pinned forward. compose ui-test-junit4 1.10.0 drags in espresso-core 3.5.0, which
# calls the reflective android.hardware.input.InputManager.getInstance — removed on
# newer platforms, so every instrumented test dies with NoSuchMethodException on an
# API 37 device. 3.7.0 is the first release that does not use it.
espresso = "3.7.0"
compose-bom = "2025.12.01"
activity-compose = "1.13.0"
lifecycle = "2.9.4"
# 1.1.0 is the newest *stable* androidx.biometric. Everything above it is alpha
# (1.4.0-alpha07 at time of writing), and an alpha is not something to put on
# the authentication path of a secrets vault. Revisit when 1.2+ ships stable.
biometric = "1.1.0"
# BiometricPrompt requires a FragmentActivity, so the single Activity the app
# owns is one — this is the dependency that makes that possible.
fragment = "1.8.9"
# The client generator. Pinned exactly: a generator that changes version changes
# the committed generated sources, which contract.sh reads as drift.
openapi-generator = "7.24.0"
ktor = "3.5.2"
kotlinx-serialization = "1.11.0"
kotlinx-datetime = "0.7.1"

[libraries]
# The BOM sets the versions of every compose-* artifact below, which is why they
# carry no version of their own.
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
