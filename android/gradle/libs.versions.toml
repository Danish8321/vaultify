# Single place where versions are ratified. Kept deliberately small: every entry
# is a dependency someone has to keep reviewing.
#
# No property-testing library is listed on purpose. The one property task 2.9
# calls for — "no nonce repeats across many generations" — is a loop and a set.
# A framework would be a new dependency bought for a five-line test.
[versions]
kotlin = "2.3.21"
agp = "8.13.1"
androidx-test-runner = "1.7.0"
androidx-test-junit = "1.3.0"

[libraries]
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
